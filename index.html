---
layout: default
title: Home
---
<h1>Blogs Directory</h1>
<ul>
  {% for post in site.posts %}
    <li>
      [{{ post.categories | join: ', ' }}] 
      <a href="{{ post.url }}">{{ post.title }}</a> 
      <span style="color:#888;">- {{ post.date | date: "%Y-%m-%d" }}</span>
    </li>
  {% endfor %}
</ul>
